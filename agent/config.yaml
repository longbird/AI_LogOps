agent:
  id: "PC-FACTORY-01"
  version: "1.4.0"

telegram:
  bot_token: "YOUR_BOT_TOKEN"
  # 관리자 개인 텔레그램 ID (봇 ID 아님). @userinfobot 으로 확인 가능.
  admin_chat_id: 123456789
  # 서버봇: 실행 결과를 서버에 전송할 때 사용
  server_bot_token: "YOUR_SERVER_BOT_TOKEN"
  server_chat_id: 123456789

monitoring:
  log_folders:
    - "C:/Apps/TargetApp/logs"
    - "C:/Apps/TargetApp/error_logs"
  history_max_mb: 10
  watch_extensions: [".log", ".txt"]

target_process:
  name: "TargetApp.exe"
  path: "C:/Apps/TargetApp/TargetApp.exe"
  backup_dir: "C:/Apps/TargetApp/backups"
  args: []                    # 프로세스 시작 인수 (예: ["--port", "8080"])
  auto_restart: false         # 프로세스 종료 시 자동 재시작
  check_interval: 30          # 자동 재시작 체크 간격 (초)

schedule:
  restart_times: []           # HH:MM 형식 (예: ["06:00", "18:00"])

connection:
  host: "127.0.0.1"
  port: 9500
  token: "default-auth-token"       # 서버의 TCP_AUTH_TOKEN 환경변수와 동일해야 함
  heartbeat_interval: 30
  reconnect_attempts: 5
  reconnect_delay: 60               # 재접속 주기 (초). 서버 연결 실패 시 이 간격으로 재시도

llm:
  # API 키는 아래 직접 입력하거나, .env 파일 또는 환경변수에 설정
  #   .env 파일: 실행 파일과 같은 폴더에 .env 생성
  #   환경변수명: OPENAI_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY
  auth_mode: "apikey"               # apikey | subscription
  default_provider: "openai"        # openai | claude | openrouter
  system_prompt: "당신은 산업용 소프트웨어 로그 분석 전문가입니다. 한국어로 답변하세요."
  max_tokens: 2000
  openai:
    api_key: ""                     # 비워두면 OPENAI_API_KEY 환경변수 사용
    model: "gpt-4o-mini"
  claude:
    api_key: ""                     # 비워두면 ANTHROPIC_API_KEY 환경변수 사용 (API Key 또는 OAuth Token)
    model: "claude-sonnet-4-20250514"
  openrouter:
    api_key: ""                     # 비워두면 OPENROUTER_API_KEY 환경변수 사용
    model: "openai/gpt-4o-mini"     # provider/model 형식 (예: anthropic/claude-sonnet-4-20250514)
  subscription:
    server_url: ""                  # 구독 서버 URL (예: http://your-server:8500)
    key: ""                         # 구독 키 (config에 미리 설정하거나, Telegram /subscribe로 입력)
    revalidate_hours: 24            # 구독 재검증 주기 (시간)

recording:
  enabled: false
  watch_dir: "D:/AirSoft/Server2/Record"
  extensions: [".wav"]
  upload_base_url: ""
  alert_on_anomaly: true
  db:
    host: "127.0.0.1"
    port: 3306
    user: "root"
    password: ""
    database: "airrec"
