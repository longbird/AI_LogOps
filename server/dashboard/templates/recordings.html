{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Recordings</h1>

<!-- Filters -->
<div class="bg-white rounded-lg shadow p-4 mb-6 flex items-end gap-4">
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Date (YYYYMMDD)</label>
        <input id="rec-date" type="text" placeholder="20260220" maxlength="8"
               class="border border-gray-300 rounded px-3 py-2 text-sm w-40 focus:ring-2 focus:ring-blue-400 focus:outline-none">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Agent ID</label>
        <input id="rec-agent" type="text" placeholder="(auto)"
               class="border border-gray-300 rounded px-3 py-2 text-sm w-48 focus:ring-2 focus:ring-blue-400 focus:outline-none">
    </div>
    <button id="rec-search" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold">
        Search
    </button>
</div>

<!-- Results Table -->
<div id="rec-results" class="bg-white rounded-lg shadow overflow-hidden">
    <div class="p-6 text-gray-500">Enter a date and click Search to load recordings.</div>
</div>

<!-- Detail Modal -->
<div id="rec-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b px-6 py-4">
            <h2 class="text-lg font-bold">Recording Detail</h2>
            <button id="rec-modal-close" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <div id="rec-modal-body" class="p-6">
            <div class="text-gray-500">Loading...</div>
        </div>
    </div>
</div>

<script>
(function() {
    const searchBtn = document.getElementById('rec-search');
    const dateInput = document.getElementById('rec-date');
    const agentInput = document.getElementById('rec-agent');
    const resultsDiv = document.getElementById('rec-results');
    const modal = document.getElementById('rec-modal');
    const modalBody = document.getElementById('rec-modal-body');
    const modalClose = document.getElementById('rec-modal-close');

    searchBtn.addEventListener('click', loadList);
    dateInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(); });

    modalClose.addEventListener('click', function() { modal.classList.add('hidden'); });
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.add('hidden'); });

    async function loadList() {
        const date = dateInput.value.trim();
        const agent = agentInput.value.trim();
        const params = new URLSearchParams();
        if (date) params.set('date', date);
        if (agent) params.set('agent_id', agent);

        resultsDiv.innerHTML = '<div class="p-6 text-gray-500">Loading...</div>';

        try {
            const resp = await fetch('/api/rec/list?' + params.toString());
            const data = await resp.json();

            if (!resp.ok) {
                resultsDiv.innerHTML = '<div class="p-6 text-red-500">Error: ' + (data.error || resp.statusText) + '</div>';
                return;
            }

            const records = data.records || [];
            if (records.length === 0) {
                resultsDiv.innerHTML = '<div class="p-6 text-gray-500">No recordings found.</div>';
                return;
            }

            let html = '<table class="min-w-full divide-y divide-gray-200">';
            html += '<thead class="bg-gray-50"><tr>';
            html += '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Rec No</th>';
            html += '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Agent</th>';
            html += '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>';
            html += '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Score</th>';
            html += '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Analyzed At</th>';
            html += '</tr></thead><tbody class="bg-white divide-y divide-gray-100">';

            for (const r of records) {
                html += '<tr class="hover:bg-gray-50 cursor-pointer" data-recno="' + (r.rec_no || '') + '">';
                html += '<td class="px-4 py-3 text-sm font-mono text-gray-800">' + (r.rec_no || '-') + '</td>';
                html += '<td class="px-4 py-3 text-sm text-gray-700">' + (r.agent_id || '-') + '</td>';
                html += '<td class="px-4 py-3 text-sm text-gray-700">' + (r.status || '-') + '</td>';
                html += '<td class="px-4 py-3 text-sm text-gray-700">' + (r.score_total != null ? r.score_total : '-') + '</td>';
                html += '<td class="px-4 py-3 text-sm text-gray-700">' + (r.analyzed_at || '-') + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table>';
            resultsDiv.innerHTML = html;

            resultsDiv.querySelectorAll('tr[data-recno]').forEach(function(row) {
                row.addEventListener('click', function() {
                    loadDetail(row.getAttribute('data-recno'));
                });
            });
        } catch (err) {
            resultsDiv.innerHTML = '<div class="p-6 text-red-500">Fetch error: ' + err.message + '</div>';
        }
    }

    async function loadDetail(recNo) {
        modal.classList.remove('hidden');
        modalBody.innerHTML = '<div class="text-gray-500">Loading...</div>';

        const agent = agentInput.value.trim();
        const params = new URLSearchParams();
        if (agent) params.set('agent_id', agent);

        try {
            const resp = await fetch('/api/rec/detail/' + recNo + '?' + params.toString());
            const data = await resp.json();

            if (!resp.ok) {
                modalBody.innerHTML = '<div class="text-red-500">Error: ' + (data.error || resp.statusText) + '</div>';
                return;
            }

            const rec = data.record || {};
            let html = '<dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">';
            for (const [key, value] of Object.entries(rec)) {
                html += '<dt class="font-semibold text-gray-600">' + key + '</dt>';
                if (typeof value === 'object' && value !== null) {
                    html += '<dd class="text-gray-800 font-mono text-xs whitespace-pre-wrap">' + JSON.stringify(value, null, 2) + '</dd>';
                } else {
                    html += '<dd class="text-gray-800">' + (value != null ? value : '-') + '</dd>';
                }
            }
            html += '</dl>';
            modalBody.innerHTML = html;
        } catch (err) {
            modalBody.innerHTML = '<div class="text-red-500">Fetch error: ' + err.message + '</div>';
        }
    }
})();
</script>
{% endblock %}
