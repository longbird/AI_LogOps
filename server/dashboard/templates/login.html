<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI-LogOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold text-center mb-6">AI-LogOps Login</h1>
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Username</label>
                <input type="text" name="username" id="username" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Password</label>
                <input type="password" name="password" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-6 flex items-center">
                <input type="checkbox" id="remember-id" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="remember-id" class="ml-2 text-sm text-gray-600 select-none cursor-pointer">아이디 기억하기</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
        </form>
        <script>
        (function() {
            var KEY = 'logops_remember_id';
            var usernameEl = document.getElementById('username');
            var checkboxEl = document.getElementById('remember-id');

            // Restore saved ID
            var saved = localStorage.getItem(KEY);
            if (saved) {
                usernameEl.value = saved;
                checkboxEl.checked = true;
            }

            // Save or clear on form submit
            document.getElementById('login-form').addEventListener('submit', function() {
                if (checkboxEl.checked) {
                    localStorage.setItem(KEY, usernameEl.value.trim());
                } else {
                    localStorage.removeItem(KEY);
                }
            });
        })();
        </script>
    </div>
</body>
</html>
