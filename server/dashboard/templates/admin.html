{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">계정 관리</h1>
    <button id="btn-add" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold">+ 계정 추가</button>
</div>

<!-- User Table -->
<div id="user-table" class="bg-white rounded-lg shadow overflow-hidden">
    <div class="p-6 text-gray-400 text-sm">로딩 중...</div>
</div>

<!-- Modal Overlay -->
<div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 relative" onclick="event.stopPropagation()">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b flex items-center justify-between">
            <h2 id="modal-title" class="text-lg font-bold text-gray-800">계정 추가</h2>
            <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 text-2xl leading-none px-2">&times;</button>
        </div>
        <!-- Modal Body -->
        <div class="p-6">
            <input type="hidden" id="f-mode" value="create">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">사용자명</label>
                    <input id="f-username" type="text" maxlength="32" placeholder="2~32자"
                           class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">비밀번호</label>
                    <input id="f-password" type="password" placeholder="4자 이상"
                           class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    <p id="pw-hint" class="text-xs text-gray-400 mt-1 hidden">비워두면 기존 비밀번호 유지</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">역할</label>
                    <select id="f-role" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        <option value="user">사용자</option>
                        <option value="admin">관리자</option>
                    </select>
                </div>
                <div id="perms-section">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">권한</label>
                    <div id="perms-list" class="grid grid-cols-2 gap-2"></div>
                    <p id="admin-perms-hint" class="text-xs text-blue-500 mt-2 hidden">관리자는 모든 권한이 자동 부여됩니다.</p>
                </div>
            </div>
            <!-- Error -->
            <div id="modal-error" class="hidden mt-4 bg-red-50 text-red-700 text-sm px-4 py-2 rounded"></div>
        </div>
        <!-- Modal Footer -->
        <div class="px-6 py-4 border-t flex justify-end gap-3">
            <button id="btn-cancel" class="px-4 py-2 rounded text-sm text-gray-600 hover:bg-gray-100">취소</button>
            <button id="btn-save" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-semibold">저장</button>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div id="delete-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 p-6 text-center" onclick="event.stopPropagation()">
        <div class="text-4xl mb-3">&#9888;</div>
        <h3 class="text-lg font-bold text-gray-800 mb-2">계정 삭제</h3>
        <p class="text-gray-500 text-sm mb-5"><b id="del-username"></b> 계정을 삭제하시겠습니까?<br>이 작업은 되돌릴 수 없습니다.</p>
        <div class="flex justify-center gap-3">
            <button id="btn-del-cancel" class="px-4 py-2 rounded text-sm text-gray-600 hover:bg-gray-100">취소</button>
            <button id="btn-del-confirm" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded text-sm font-semibold">삭제</button>
        </div>
    </div>
</div>

<script>
(function() {
    var tableWrap = document.getElementById('user-table');
    var modalOverlay = document.getElementById('modal-overlay');
    var deleteOverlay = document.getElementById('delete-overlay');
    var allPermissions = {};
    var deleteTarget = '';

    /* ── Load Users ── */
    async function loadUsers() {
        try {
            var resp = await fetch('/api/admin/users');
            var data = await resp.json();
            allPermissions = data.permissions || {};
            renderTable(data.users || {});
        } catch(e) {
            tableWrap.innerHTML = '<div class="p-6 text-red-500">로딩 실패: ' + e.message + '</div>';
        }
    }

    function renderTable(users) {
        var usernames = Object.keys(users);
        if (!usernames.length) {
            tableWrap.innerHTML = '<div class="p-6 text-gray-400">등록된 사용자가 없습니다.</div>';
            return;
        }

        var html = '<table class="min-w-full divide-y divide-gray-200">';
        html += '<thead class="bg-gray-50"><tr>';
        html += '<th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase">사용자명</th>';
        html += '<th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase">역할</th>';
        html += '<th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase">권한</th>';
        html += '<th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase">생성일</th>';
        html += '<th class="px-5 py-3 text-right text-xs font-semibold text-gray-600 uppercase">작업</th>';
        html += '</tr></thead><tbody class="bg-white divide-y divide-gray-100">';

        for (var i = 0; i < usernames.length; i++) {
            var uname = usernames[i];
            var u = users[uname];
            var roleBadge = u.role === 'admin'
                ? '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-800">관리자</span>'
                : '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">사용자</span>';

            var permLabels = (u.permissions || []).map(function(p) {
                return '<span class="inline-block bg-blue-50 text-blue-700 text-[11px] px-1.5 py-0.5 rounded mr-1 mb-1">' + esc(allPermissions[p] || p) + '</span>';
            }).join('');

            var created = u.created_at ? formatDate(u.created_at) : '-';

            html += '<tr>';
            html += '<td class="px-5 py-3 text-sm font-semibold text-gray-800">' + esc(uname) + '</td>';
            html += '<td class="px-5 py-3 text-sm">' + roleBadge + '</td>';
            html += '<td class="px-5 py-3 text-sm">' + (permLabels || '<span class="text-gray-400">-</span>') + '</td>';
            html += '<td class="px-5 py-3 text-sm text-gray-500">' + created + '</td>';
            html += '<td class="px-5 py-3 text-sm text-right whitespace-nowrap">';
            html += '<button class="text-blue-600 hover:text-blue-800 text-sm mr-3 btn-edit" data-username="' + esc(uname) + '">수정</button>';
            if (u.role !== 'admin' || usernames.filter(function(n){ return users[n].role === 'admin'; }).length > 1) {
                html += '<button class="text-red-500 hover:text-red-700 text-sm btn-delete" data-username="' + esc(uname) + '">삭제</button>';
            }
            html += '</td>';
            html += '</tr>';
        }
        html += '</tbody></table>';
        tableWrap.innerHTML = html;

        // Bind buttons
        tableWrap.querySelectorAll('.btn-edit').forEach(function(btn) {
            btn.addEventListener('click', function() { openEditModal(btn.getAttribute('data-username')); });
        });
        tableWrap.querySelectorAll('.btn-delete').forEach(function(btn) {
            btn.addEventListener('click', function() { openDeleteModal(btn.getAttribute('data-username')); });
        });
    }

    /* ── Modal ── */
    function openCreateModal() {
        document.getElementById('modal-title').textContent = '계정 추가';
        document.getElementById('f-mode').value = 'create';
        document.getElementById('f-username').value = '';
        document.getElementById('f-username').disabled = false;
        document.getElementById('f-password').value = '';
        document.getElementById('f-password').placeholder = '4자 이상';
        document.getElementById('pw-hint').classList.add('hidden');
        document.getElementById('f-role').value = 'user';
        document.getElementById('modal-error').classList.add('hidden');
        renderPermCheckboxes([]);
        updateRoleUI();
        modalOverlay.classList.remove('hidden');
    }

    async function openEditModal(username) {
        try {
            var resp = await fetch('/api/admin/users');
            var data = await resp.json();
            var u = (data.users || {})[username];
            if (!u) return;
            allPermissions = data.permissions || {};

            document.getElementById('modal-title').textContent = '계정 수정 — ' + username;
            document.getElementById('f-mode').value = 'edit';
            document.getElementById('f-username').value = username;
            document.getElementById('f-username').disabled = true;
            document.getElementById('f-password').value = '';
            document.getElementById('f-password').placeholder = '변경 시 입력';
            document.getElementById('pw-hint').classList.remove('hidden');
            document.getElementById('f-role').value = u.role;
            document.getElementById('modal-error').classList.add('hidden');
            renderPermCheckboxes(u.permissions || []);
            updateRoleUI();
            modalOverlay.classList.remove('hidden');
        } catch(e) { /* ignore */ }
    }

    function renderPermCheckboxes(selected) {
        var container = document.getElementById('perms-list');
        var html = '';
        var keys = Object.keys(allPermissions);
        for (var i = 0; i < keys.length; i++) {
            var p = keys[i];
            var checked = selected.indexOf(p) >= 0 ? 'checked' : '';
            html += '<label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">';
            html += '<input type="checkbox" name="perm" value="' + p + '" ' + checked + ' class="perm-cb rounded border-gray-300 text-blue-600 focus:ring-blue-400">';
            html += esc(allPermissions[p]);
            html += '</label>';
        }
        container.innerHTML = html;
    }

    function updateRoleUI() {
        var role = document.getElementById('f-role').value;
        var hint = document.getElementById('admin-perms-hint');
        var checkboxes = document.querySelectorAll('.perm-cb');
        if (role === 'admin') {
            hint.classList.remove('hidden');
            checkboxes.forEach(function(cb) { cb.checked = true; cb.disabled = true; });
        } else {
            hint.classList.add('hidden');
            checkboxes.forEach(function(cb) { cb.disabled = false; });
        }
    }

    document.getElementById('f-role').addEventListener('change', updateRoleUI);

    function closeModal() {
        modalOverlay.classList.add('hidden');
    }

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (!deleteOverlay.classList.contains('hidden')) { deleteOverlay.classList.add('hidden'); }
            else if (!modalOverlay.classList.contains('hidden')) { closeModal(); }
        }
    });

    document.getElementById('btn-add').addEventListener('click', openCreateModal);

    /* ── Save ── */
    document.getElementById('btn-save').addEventListener('click', async function() {
        var mode = document.getElementById('f-mode').value;
        var username = document.getElementById('f-username').value.trim();
        var password = document.getElementById('f-password').value;
        var role = document.getElementById('f-role').value;
        var perms = [];
        document.querySelectorAll('.perm-cb:checked').forEach(function(cb) { perms.push(cb.value); });

        var errorEl = document.getElementById('modal-error');
        errorEl.classList.add('hidden');

        try {
            var resp;
            if (mode === 'create') {
                resp = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password, role: role, permissions: perms })
                });
            } else {
                var body = { role: role, permissions: perms };
                if (password) body.password = password;
                resp = await fetch('/api/admin/users/' + encodeURIComponent(username), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            }

            var data = await resp.json();
            if (!resp.ok) {
                errorEl.textContent = data.error || '오류가 발생했습니다';
                errorEl.classList.remove('hidden');
                return;
            }

            closeModal();
            loadUsers();
        } catch(e) {
            errorEl.textContent = '네트워크 오류: ' + e.message;
            errorEl.classList.remove('hidden');
        }
    });

    /* ── Delete ── */
    function openDeleteModal(username) {
        deleteTarget = username;
        document.getElementById('del-username').textContent = username;
        deleteOverlay.classList.remove('hidden');
    }

    document.getElementById('btn-del-cancel').addEventListener('click', function() {
        deleteOverlay.classList.add('hidden');
    });
    deleteOverlay.addEventListener('click', function(e) {
        if (e.target === deleteOverlay) deleteOverlay.classList.add('hidden');
    });

    document.getElementById('btn-del-confirm').addEventListener('click', async function() {
        if (!deleteTarget) return;
        try {
            var resp = await fetch('/api/admin/users/' + encodeURIComponent(deleteTarget), { method: 'DELETE' });
            var data = await resp.json();
            if (!resp.ok) {
                alert(data.error || '삭제 실패');
            }
        } catch(e) {
            alert('네트워크 오류: ' + e.message);
        }
        deleteOverlay.classList.add('hidden');
        deleteTarget = '';
        loadUsers();
    });

    /* ── Utils ── */
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatDate(dt) {
        try { return new Date(dt).toLocaleString('ko-KR', { hour12: false }); } catch(e) { return dt; }
    }

    /* Init */
    loadUsers();
})();
</script>
{% endblock %}
