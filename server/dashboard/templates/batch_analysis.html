{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">로그 분석 (배치)</h1>

<!-- Control Card -->
<div class="bg-white rounded-lg shadow p-4 mb-6">
    <h2 class="text-sm font-semibold text-gray-600 uppercase mb-3">분석 설정</h2>
    <div class="flex items-end gap-4 flex-wrap">
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">에이전트</label>
            <select id="ba-agent" data-persist="ba_agent" onchange="fetchFolders()"
                    class="border border-gray-300 rounded px-3 py-2 text-sm w-48 focus:ring-2 focus:ring-blue-400 focus:outline-none">
                {% for agent_id in agents %}<option value="{{ agent_id }}">{{ agent_id }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">날짜 (YYYYMMDD)</label>
            <input id="ba-date" type="text" maxlength="8" data-persist="ba_date"
                   class="border border-gray-300 rounded px-3 py-2 text-sm w-40 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">폴더</label>
            <select id="ba-folder" data-persist="ba_folder"
                    class="border border-gray-300 rounded px-3 py-2 text-sm w-48 focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <option value="-1">-1 (전체)</option>
            </select>
        </div>
        <button id="btn-download" onclick="doDownload()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-semibold">
            로그 다운로드
        </button>
        <button id="btn-analyze" onclick="doAnalyze()"
                class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded text-sm font-semibold">
            분석 실행
        </button>
        <div id="ba-status" class="ml-2 text-sm text-gray-500"></div>
    </div>
    <div id="ba-files" class="mt-3 text-xs text-gray-400"></div>
</div>

<!-- Summary Card -->
<div id="summary-card" class="bg-white rounded-lg shadow p-4 mb-6 hidden">
    <h2 class="text-sm font-semibold text-gray-600 uppercase mb-3">분석 요약</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3" id="summary-grid"></div>
</div>

<!-- Report Card -->
<div id="report-card" class="bg-white rounded-lg shadow p-4 mb-6 hidden">
    <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-600 uppercase">분석 리포트</h2>
        <button onclick="copyReport()" class="text-xs text-blue-600 hover:text-blue-800 underline">복사</button>
    </div>
    <div id="report-content" class="bg-gray-50 border rounded p-4 font-mono text-xs leading-relaxed overflow-auto max-h-[70vh] whitespace-pre-wrap"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = (msg, color) => { const el = $('ba-status'); el.textContent = msg; el.className = 'ml-2 text-sm text-' + color + '-600'; };

async function fetchFolders() {
    const agent = $('ba-agent').value;
    if (!agent) return;

    const folderSel = $('ba-folder');
    folderSel.innerHTML = '<option value="-1">-1 (전체)</option>';

    try {
        const res = await fetch('/api/config/' + agent);
        if (!res.ok) return;
        const data = await res.json();
        const config = data.config || data;
        const logFolders = (config.monitoring || {}).log_folders || [];
        if (!logFolders.length) return;

        logFolders.forEach((path, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = i + ': ' + path;
            folderSel.appendChild(opt);
        });
        // Restore persisted value if still valid
        const saved = localStorage.getItem('ba_folder');
        if (saved !== null) {
            const match = Array.from(folderSel.options).find(o => o.value === saved);
            if (match) folderSel.value = saved;
        }
    } catch (e) {
        // silently ignore — folder select stays at default "-1 (전체)"
    }
}

// Set default date to today
(function() {
    const d = $('ba-date');
    if (!d.value) {
        const now = new Date();
        d.value = now.getFullYear().toString() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0');
    }
})();

async function doDownload() {
    const agent = $('ba-agent').value;
    const date = $('ba-date').value;
    if (!agent || !date) { status('에이전트와 날짜를 입력하세요', 'red'); return; }

    $('btn-download').disabled = true;
    status('다운로드 요청 중...', 'yellow');

    try {
        const res = await fetch('/api/batch-analysis/download', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({agent_id: agent, date: date, folder_index: parseInt($('ba-folder').value, 10)})
        });
        const data = await res.json();
        if (!res.ok) { status('다운로드 실패: ' + (data.error || ''), 'red'); return; }
        status('다운로드 요청 완료. 파일 확인 중...', 'blue');
        pollFiles(agent, date, 0);
    } catch (e) {
        status('요청 오류: ' + e.message, 'red');
    } finally {
        $('btn-download').disabled = false;
    }
}

async function pollFiles(agent, date, attempt, prevCount) {
    if (prevCount === undefined) prevCount = -1;
    try {
        const res = await fetch('/api/batch-analysis/files?agent_id=' + agent + '&date=' + date);
        const data = await res.json();
        const info = data.count + '개 파일, ' + (data.total_size / 1024).toFixed(0) + ' KB';
        $('ba-files').textContent = '저장된 로그: ' + info + (data.files.length ? ' (' + data.files.join(', ') + ')' : '');

        if (data.count > 0 && data.count === prevCount) {
            // File count stopped changing — download complete
            status('로그 준비 완료 (' + data.count + '개 파일)', 'green');
        } else if (attempt < 60) {
            const msg = data.count > 0
                ? '다운로드 중... ' + data.count + '개 파일 수신'
                : '파일 대기 중... (' + (attempt + 1) + '/60)';
            status(msg, 'yellow');
            setTimeout(() => pollFiles(agent, date, attempt + 1, data.count), 2000);
        } else {
            status('다운로드 타임아웃 (' + data.count + '개 파일 수신됨)', data.count > 0 ? 'yellow' : 'red');
        }
    } catch (e) {
        status('파일 확인 오류: ' + e.message, 'red');
    }
}

async function doAnalyze() {
    const agent = $('ba-agent').value;
    const date = $('ba-date').value;
    if (!agent || !date) { status('에이전트와 날짜를 입력하세요', 'red'); return; }

    $('btn-analyze').disabled = true;
    status('분석 중... (수십 초 소요될 수 있음)', 'yellow');
    $('summary-card').classList.add('hidden');
    $('report-card').classList.add('hidden');

    try {
        const res = await fetch('/api/batch-analysis/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({agent_id: agent, date: date})
        });
        const data = await res.json();
        if (!res.ok) { status('분석 실패: ' + (data.error || ''), 'red'); return; }

        // Summary
        const s = data.summary;
        const items = [
            {label: '총 라인', value: s.total_lines.toLocaleString(), color: 'gray'},
            {label: '인바운드', value: s.inbound.toLocaleString(), color: 'blue'},
            {label: '아웃바운드', value: s.outbound.toLocaleString(), color: 'blue'},
            {label: '녹취(FC)', value: s.file_close_count.toLocaleString(), color: 'green'},
            {label: 'DB실패', value: s.db_fail_count.toString(), color: s.db_fail_count > 0 ? 'red' : 'gray'},
            {label: '미녹취', value: s.unrecorded_count.toString(), color: s.unrecorded_count > 0 ? 'red' : 'green'},
            {label: '시간불일치', value: s.duration_mismatch_count.toString(), color: s.duration_mismatch_count > 0 ? 'yellow' : 'gray'},
        ];
        $('summary-grid').innerHTML = items.map(i =>
            '<div class="bg-' + i.color + '-50 rounded-lg p-3 text-center">' +
            '<div class="text-xs text-gray-500 mb-1">' + i.label + '</div>' +
            '<div class="text-lg font-bold text-' + i.color + '-700">' + i.value + '</div></div>'
        ).join('');
        $('summary-card').classList.remove('hidden');

        // Report
        $('report-content').textContent = data.report;
        $('report-card').classList.remove('hidden');

        status('분석 완료: ' + s.inbound + '/' + s.outbound + '건 (인/아웃)', 'green');
    } catch (e) {
        status('분석 오류: ' + e.message, 'red');
    } finally {
        $('btn-analyze').disabled = false;
    }
}

function copyReport() {
    const text = $('report-content').textContent;
    navigator.clipboard.writeText(text).then(() => status('리포트 복사됨', 'green'));
}

// Initial load: populate folders and show current file state
(function() {
    const agent = $('ba-agent').value;
    const date = $('ba-date').value;
    if (agent) fetchFolders();
    if (agent && date) pollFiles(agent, date, 60);  // attempt=60 to show current state without polling
})();
</script>
{% endblock %}
