{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">AI Reports</h1>

{% if reports %}
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Agent</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">File</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Size</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Modified</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">View</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
            {% for report in reports %}
            <tr>
                <td class="px-4 py-3 text-sm text-gray-800">{{ report.agent_id }}</td>
                <td class="px-4 py-3 text-sm font-mono text-gray-700">{{ report.filename }}</td>
                <td class="px-4 py-3 text-sm text-gray-700">{{ report.size }} bytes</td>
                <td class="px-4 py-3 text-sm text-gray-700">{{ report.modified }}</td>
                <td class="px-4 py-3 text-sm">
                    <a
                        class="text-blue-600 hover:text-blue-800 font-semibold"
                        href="/api/reports/{{ report.agent_id }}/{{ report.filename }}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="bg-white rounded-lg shadow p-6 text-gray-500">No reports found.</div>
{% endif %}
{% endblock %}
