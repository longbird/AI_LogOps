<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("AI-LogOps") }} - AI-LogOps Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-gray-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-8">
                    <span class="text-xl font-bold">AI-LogOps</span>
                    <a href="/dashboard" class="hover:text-gray-300">Dashboard</a>
                    <a href="/logs" class="hover:text-gray-300">Logs</a>
                    <a href="/reports" class="hover:text-gray-300">Reports</a>
                    <a href="/deploys" class="hover:text-gray-300">Deploys</a>
                    <a href="/recordings" class="hover:text-gray-300">Recordings</a>
                </div>
                <a href="/logout" class="hover:text-gray-300">Logout</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}
        {{ content | default("") }}
        {% endblock %}
    </main>
</body>
</html>
