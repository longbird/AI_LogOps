server:
  tcp_host: "0.0.0.0"
  tcp_port: 9500
  max_agents: 10

ai:
  default_provider: "openai"
  openai:
    api_key: "REDACTED_OPENAI_KEY"
    model: "gpt-4o"
  claude:
    api_key: "sk-ant-..."
    model: "claude-sonnet-4-20250514"

telegram:
  # 서버봇: 서버가 폴링하며 에이전트 결과를 수신
  server_bot_token: "REDACTED_SERVER_BOT_TOKEN"
  # 에이전트봇: 서버가 에이전트에게 명령을 전송
  agent_bot_token: "REDACTED_AGENT_BOT_TOKEN"
  # 에이전트 관리자 채팅 ID (에이전트봇에 명령 전송 대상)
  agent_chat_id: 0
  # 서버 관리자 채팅 ID 목록 (서버봇 결과 수신 허용)
  admin_chat_ids: [0]

dashboard:
  host: "0.0.0.0"
  port: 8080
  secret_key: "REDACTED_DASHBOARD_SECRET"

storage:
  base_dir: "./storage"
  max_log_retention_days: 30
  max_backups_per_agent: 5

health:
  check_interval: 300
  cpu_threshold: 90
  memory_threshold: 85
  disk_threshold: 90
  alert_cooldown: 1800
