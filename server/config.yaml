server:
  tcp_host: "0.0.0.0"
  tcp_port: 9500
  max_agents: 10

ai:
  default_provider: "openai"
  openai:
    # API 키는 .env 파일 또는 환경변수(OPENAI_API_KEY)에 설정하세요
    api_key: ""
    model: "gpt-4o"
  claude:
    # API 키는 .env 파일 또는 환경변수(ANTHROPIC_API_KEY)에 설정하세요
    api_key: ""
    model: "claude-sonnet-4-20250514"

telegram:
  # 봇 토큰은 .env 파일 또는 환경변수에 설정하세요
  # TELEGRAM_SERVER_BOT_TOKEN, TELEGRAM_AGENT_BOT_TOKEN
  # 서버봇: 서버가 폴링하며 에이전트 결과를 수신
  server_bot_token: ""
  # 에이전트봇: 서버가 에이전트에게 명령을 전송
  agent_bot_token: ""
  # 에이전트 관리자 채팅 ID (에이전트봇에 명령 전송 대상)
  # TELEGRAM_AGENT_CHAT_ID 환경변수로도 설정 가능
  agent_chat_id: 0
  # 서버 관리자 채팅 ID 목록 (서버봇 결과 수신 허용)
  # TELEGRAM_ADMIN_CHAT_ID 환경변수로도 설정 가능
  admin_chat_ids: []

dashboard:
  # false로 설정하면 서버 시작 시 대시보드를 자동으로 시작하지 않음
  # 텔레그램 /dashboard start 명령으로 필요할 때 시작 가능
  enabled: true
  host: "0.0.0.0"
  port: 9090
  # 에이전트가 접근 가능한 서버 공개 URL (녹취 업로드용)
  # 미설정 시 http://{host}:{port} 사용 (원격 에이전트는 반드시 설정 필요)
  public_url: "http://61.42.53.61:9090"  # DASHBOARD_SECRET_KEY 환경변수로도 설정 가능
  secret_key: "CHANGE_ME"

storage:
  base_dir: "./storage"
  max_log_retention_days: 30
  max_backups_per_agent: 5

health:
  check_interval: 300
  cpu_threshold: 90
  memory_threshold: 85
  disk_threshold: 90
  alert_cooldown: 1800

# ── STT (음성 인식) 설정 ──
stt:
  # 로컬 Whisper 엔진 설정
  whisper:
    # 모델: HuggingFace 모델 ID 또는 faster-whisper 내장 모델명 또는 로컬 경로
    # 한국어 지명 파인튜닝 모델: ./storage/stt/models/faster-whisper-ko-place (whisper-small 기반, CER 0.31%)
    # 한국어 파인튜닝 모델: ghost613/faster-whisper-large-v3-turbo-korean (깨끗한 음성 전용, µ-law 전화 음성 미지원)
    # 전화 녹음 최적: large-v3-turbo (µ-law/8kHz 전화 음성에서 가장 안정적)
    # 내장 모델: tiny, base, small, medium, large-v2, large-v3, large-v3-turbo
    model: "./storage/stt/models/faster-whisper-ko-place"
    device: "cpu"       # cpu 또는 cuda
    compute_type: "float32" # int8(CPU최적), float16(GPU), float32(CPU호환)
    beam_size: 5
    language: "ko"
    vad_filter: true
    vad_parameters:
      threshold: 0.5                # 음성 감지 임계값 — 0.35→0.5 (환각 방지: 노이즈를 음성으로 오판 감소)
      min_speech_duration_ms: 250   # 최소 발화 길이 — 150→250ms (극초단 환각 세그먼트 제거)
      min_silence_duration_ms: 700  # 최소 무음 길이 — 300→700ms (짧은 무음에서 환각 방지)
      speech_pad_ms: 150            # 발화 앞뒤 패딩 — 200→150ms (불필요 노이즈 포함 줄임)

    # 환각 방지 파라미터
    hallucination_prevention:
      compression_ratio_threshold: 1.5  # 반복 텍스트 감지 — 2.4→1.5 (엄격, 반복 차단)
      log_prob_threshold: -0.3          # 낮은 확률 세그먼트 필터링 — -1.0→-0.3 (저확률 환각 제거)
      no_speech_threshold: 0.5          # 무음 감지 — 0.8→0.5 (무음 구간 적극 제거)
      condition_on_previous_text: false # 반복 전파 차단
      repetition_penalty: 1.2          # 반복 생성 페널티 (1.0=없음, 높을수록 반복 억제)
      temperature:
        - 0.0    # 첫 시도: 결정적
        - 0.2    # 폴백 1

    # 도메인 프롬프트 (initial_prompt) — 대리운전 콜센터 도메인
    # STT 결과 기반 자동 업데이트 시 이 값은 기본값으로 사용됨
    initial_prompt: >-
      안녕하세요, 대리운전입니다. 어디로 모실까요?
      출발지와 도착지를 말씀해 주세요.
      강남역, 홍대입구역, 서울역, 잠실역, 신림역, 구로디지털단지역,
      수원역, 인천역, 판교역, 부천역, 일산, 분당,
      아파트, 주민센터, 사거리, 삼거리, 대로,
      대리 요금, 만 원, 이만 원, 삼만 원, 할인, 추가 요금,
      기사님, 손님, 고객님, 예약, 배차, 도착 예정

  # 오디오 전처리 설정
  preprocessing:
    enabled: true
    resample_rate: 16000      # Whisper 입력 기준 샘플레이트
    # 대역 필터: 전화 음성 대역 (300~3400Hz) 추출
    bandpass:
      enabled: true
      low_freq: 300
      high_freq: 3400
    # 노이즈 감소
    noise_reduction:
      enabled: true
      # prop_decrease: 노이즈 감소 비율 (0.0~1.0, 높을수록 공격적)
      prop_decrease: 0.8
    # 음량 정규화
    normalize:
      enabled: true
      target_dbfs: -20.0       # 목표 dBFS (LUFS 근사치)

  # 도메인 프롬프트 자동 업데이트
  prompt_auto_update:
    enabled: true
    # 프롬프트 저장 경로 (storage 기준 상대경로)
    prompt_file: "stt/domain_prompt.txt"
    # 위치/도메인 어휘 사전 경로
    vocabulary_file: "stt/domain_vocabulary.json"
    # 업데이트 주기: 매 N건의 STT 처리 후 프롬프트 갱신
    update_interval: 50
    # 프롬프트 최대 토큰 수 (Whisper 제한: ~224 tokens)
    max_prompt_tokens: 200

  # 데이터 축적 및 자동 학습
  learning:
    enabled: true
    # 학습 데이터 저장 경로
    data_dir: "stt/training_data"
    # 위치/지명 자동 추출 및 축적
    location_extraction:
      enabled: true
      # 위치 패턴 매칭 키워드 (정규식)
      patterns:
        - "(에서|부터)\\s*출발"
        - "(으로|까지)\\s*(가|와|오)"
        - "(역|동|구|시|읍|면|리|아파트|빌딩|타워|센터|병원|학교|대학|공원|마트)"
    # N건 축적 후 vocabulary 갱신
    vocab_update_interval: 100
